user root;
error_log logs/error.log;
pid logs/nginx.pid;

worker_processes 1;

events {
    worker_connections 1024;
}

http {

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /mnt/sdcard/extra_binary/static-bin-armv7/nginx/nginx/1.19.4/cert/nginx.crt;
        ssl_certificate_key /mnt/sdcard/extra_binary/static-bin-armv7/nginx/nginx/1.19.4/cert/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass https://192.168.1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /php/ {
            proxy_pass http://127.0.0.1:8081;
        }

        location /cgi-bin/ {
            fastcgi_pass unix:/tmp/fcgiwrap.sock;
            include conf/fastcgi.conf;
        }
    }
}
